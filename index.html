*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:#173b40;font:15px system-ui,sans-serif}header{background:#123f45;color:white;padding:30px max(5%,20px)}header p{color:#bad9d8}h1{font-size:30px;margin:8px 0}main{max-width:1450px;margin:auto;padding:25px}button,select,input{font:inherit;border:1px solid #bdccce;border-radius:9px;padding:11px;background:white;color:#173b40}button{cursor:pointer}button:hover{background:#deefeb}label{display:grid;gap:5px;font-size:12px;font-weight:700}.filters,nav{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}.filters input{min-width:240px}nav button.active{background:#176d67;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.card,section{background:white;border:1px solid #dce6e6;border-radius:14px;padding:20px;margin-bottom:20px}.card b{display:block;font-size:30px;margin-top:8px}.muted{color:#60787a;font-size:13px}.scroll{overflow:auto;max-height:600px}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid #e4ecec}th{position:sticky;top:0;background:#eaf3f2;z-index:1}tbody tr:hover{background:#f1f8f6}.fail{color:#ae3547;font-weight:700}.pass{color:#087466;font-weight:700}.bar{display:inline-block;height:10px;border-radius:6px;background:#28a18b;vertical-align:middle;margin-right:10px}.error{color:#b33144}#status{padding:10px 0}h2{font-size:19px}a{color:inherit}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:750px){main{padding:14px}.split{grid-template-columns:1fr}h1{font-size:25px}.filters>*{flex:1}header{padding:22px}.cards{grid-template-columns:1fr 1fr}}@media print{header{background:white;color:black}.filters,nav,button{display:none}.scroll{max-height:none;overflow:visible}section{break-inside:avoid}}

header{background:#101d32;padding:25px 32px;margin-left:230px}header small{letter-spacing:2px;color:#65d6c3}header h1{letter-spacing:-1px}header p{margin-bottom:0}main{margin-left:230px;padding:28px;max-width:none}nav{position:fixed;left:0;top:0;bottom:0;width:230px;background:#101d32;padding:145px 18px 25px;display:flex;flex-direction:column;flex-wrap:nowrap;margin:0;z-index:5}nav:before{content:'ENGLISH / SPM';position:absolute;top:45px;left:24px;color:#7fe2cf;font-size:19px;font-weight:800;letter-spacing:1px}nav button{text-align:left;border:0;background:transparent;color:#b4c2d9;padding:15px 13px}nav button.active{background:#087f79;box-shadow:0 6px 20px #0002}nav button:hover{background:#24354d}.filters{background:white;border:1px solid #e1e9ed;padding:16px;border-radius:14px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{box-shadow:0 5px 14px #173b4005;border-top:3px solid #36ad9c}.card b{font-size:32px;color:#162a43}section{box-shadow:0 5px 20px #173b4005}.chartrow{display:grid;grid-template-columns:110px 1fr 55px;gap:12px;align-items:center;margin:16px 0;font-size:12px}.track{background:#eef4f5;border-radius:5px;overflow:hidden;height:13px}.track i{display:block;height:100%;background:linear-gradient(90deg,#007e80,#4bc8ad);border-radius:5px}.donut{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;margin:25px auto}.donut span{width:157px;height:157px;border-radius:50%;background:white;display:grid;place-content:center;text-align:center;font-size:28px;font-weight:800}.donut small{font-size:12px;color:#708190;font-weight:400}.legend{text-align:center;color:#60787a}.intro{padding:24px;background:linear-gradient(120deg,#17394b,#122137);color:white;border:0}.intro h2{font-size:24px;margin:0 0 8px}.intro p{margin:0;color:#bdd9df}.muted{line-height:1.6}@media(max-width:1000px){nav{width:190px;padding-left:10px;padding-right:10px}header,main{margin-left:190px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:750px){header,main{margin-left:0}nav{position:static;width:auto;padding:0;background:transparent;flex-direction:row;overflow:auto;margin-bottom:20px}nav:before{display:none}nav button{color:#284657;white-space:nowrap;background:#e4eeee}header{padding:24px}main{padding:15px}.chartrow{grid-template-columns:90px 1fr 45px}}@media print{header,main{margin-left:0}nav{display:none}.cards{grid-template-columns:repeat(4,1fr)}}

</style></head><body><header><small>SMK TUN ISMAIL · ENGLISH PANEL</small><h1>English Performance Dashboard</h1><p>SPM cohorts · Progress, targets & focused support</p></header><main><div class="filters"><label>SPM Cohort<select id="cohort"></select></label><label>Exam<select id="exam"></select></label><label>Form<select id="form"><option value="">All forms</option></select></label><label>Class at exam<select id="classFilter"></select></label><label>Student search<input id="search" placeholder="Type a student’s name"></label><label>Data<button id="refresh" onclick="load()">Refresh from Sheet</button></label><label>Report<button onclick="window.print()">Print</button></label></div><p id="status" role="status">Connecting to your Google Sheet…</p><nav id="nav"></nav><div id="content"></div></main><script>
let D,tab='Overview';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>x!==''&&x!==null&&x!==undefined&&Number.isFinite(Number(x))?Number(x):null;
const mark=r=>{let n=num(r.Total_Mark_100);return /^(absent|th|tidak hadir)$/i.test(String(r.Attendance_Optional).trim())||n===null||n<0||n>100?null:n};

// School grade scale supplied by the teacher. Decimal marks use the lower-bound bands.
function gradeFor(markValue,attendance=''){
 const absent=/^(TH|ABSENT|TIDAK HADIR)$/i;
 if(absent.test(String(attendance).trim())||absent.test(String(markValue).trim()))return 'TH';
 if(markValue==null||String(markValue).trim()==='')return '';
 const m=Number(markValue);if(!Number.isFinite(m)||m<0||m>100)return '';
 return [[90,'A+'],[80,'A'],[70,'A-'],[65,'B+'],[60,'B'],[55,'C+'],[50,'C'],[45,'D'],[40,'E'],[0,'G']].find(([minimum])=>m>=minimum)[1];
}
function trackerWithGrades(row){
 const result=Array.from({length:19},(_,i)=>row[i]??'');
 for(const i of [4,6,8,10,12,14,16,18]){
   result[i]=String(result[i]).trim().toUpperCase()==='TH'?'TH':gradeFor(result[i-1]);
 }
 return result;
}

function objects(a){return a.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>Object.fromEntries(a[0].map((h,i)=>[h,r[i]??''])))}
function select(id,vals,all){const old=$(id).value;$(id).innerHTML=(all?'<option value="">'+all+'</option>':'')+vals.map(x=>'<option>'+esc(x)+'</option>').join('');if(vals.includes(old))$(id).value=old}
const unique=a=>[...new Set(a.filter(x=>x!==''&&x!==null).map(String))].sort();
const SHEET_ID='1HHL92HTiXhSvXAE-1g3mRIVUdyM16agTJw1lPf7pEf0';
let requestCounter=0;
function readSheet(name,headers=1){return new Promise((resolve,reject)=>{
 const cb='sheetResponse_'+Date.now()+'_'+(++requestCounter),script=document.createElement('script');
 let timer;function clean(){clearTimeout(timer);script.remove();delete window[cb]}
 window[cb]=response=>{clean();if(response.status==='error'||!response.table){reject(new Error('Could not read '+name));return}const t=response.table,rows=t.rows.map(r=>t.cols.map((c,i)=>r.c[i]?(r.c[i].f??r.c[i].v??''):''));resolve(headers===3?[[],[],[],...rows]:[t.cols.map(c=>c.label),...rows])};
 script.onerror=()=>{clean();reject(new Error('Connection failed for '+name))};timer=setTimeout(()=>{clean();reject(new Error('Timed out reading '+name))},25000);
 const params=new URLSearchParams({sheet:name,headers:String(headers),tqx:'out:json;responseHandler:'+cb,_:String(Date.now())});
 script.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?'+params;document.head.appendChild(script);
})}
async function load(){
 $('refresh').disabled=true;$('status').textContent='Reading your Google Sheet…';
 try{const [results,tracker,targets,interventions,items,settings]=await Promise.all([readSheet('RESULTS_DATA'),readSheet('HEADCOUNT_TRACKER',3),readSheet('TARGETS'),readSheet('INTERVENTION'),readSheet('ITEM_ANALYSIS_DATA'),readSheet('SETTINGS')]);
 const passRow=settings.find(r=>r[0]==='Official Pass Mark (0–100)');const passMark=passRow?num(passRow[1]):null;if(passMark===null||passMark<0||passMark>100)throw new Error('Valid pass mark missing in SETTINGS');
 for(const h of ['SPM_Cohort','Academic_Year','Class_At_Exam','Student_Name','Exam','Total_Mark_100'])if(!results[0].includes(h))throw new Error('Missing RESULTS_DATA column: '+h);
 const data={results,tracker,targets,interventions,items,passMark,updated:new Date().toISOString()};for(const k of ['results','targets','interventions','items'])data[k]=objects(data[k]);
 data.results=data.results.filter(r=>r.Student_Name);const seen=new Set();for(const r of data.results){const key=JSON.stringify([r.SPM_Cohort,r.Academic_Year,r.Student_Name,r.Exam]);if(seen.has(key))throw new Error('Duplicate student/exam records. Please check RESULTS_DATA.');seen.add(key)}
 D=data;select('cohort',unique(D.results.map(r=>r.SPM_Cohort)),false);select('form',unique(D.results.map(r=>r.Form)),'All forms');setExams();$('status').className='muted';$('status').textContent='Connected · Retrieved '+new Date(D.updated).toLocaleString()+' · Pass mark '+D.passMark+'/100 · Refresh after Sheet updates; Google may briefly cache changes.';render();
 }catch(e){$('status').className='error';$('status').textContent=(D?'Refresh failed; showing previously loaded data. ':'')+e.message+'. Check your internet connection and that the Sheet is shared as Anyone with the link → Viewer, then click Refresh.';}finally{$('refresh').disabled=false}
}
function setExams(){const available=unique(D.results.filter(r=>String(r.SPM_Cohort)===$('cohort').value).map(r=>r.Exam));select('exam',['TOV','AR1','AR2','AR3','SPM'].filter(x=>available.includes(x)).concat(available.filter(x=>!['TOV','AR1','AR2','AR3','SPM'].includes(x))),false);setClasses()}
function setClasses(){select('classFilter',unique(D.results.filter(r=>String(r.SPM_Cohort)===$('cohort').value&&r.Exam===$('exam').value).map(r=>r.Class_At_Exam||'Unassigned')),'All classes')}
function filtered(rows,exam=true){return rows.filter(r=>String(r.SPM_Cohort)===$('cohort').value&&(!exam||r.Exam===$('exam').value)&&(!$('form').value||r.Form===$('form').value)&&(!$('classFilter').value||(r.Class_At_Exam||r.Class||'Unassigned')===$('classFilter').value)&&(!$('search').value||String(r.Student_Name||'').toLowerCase().includes($('search').value.trim().toLowerCase())))}
function stats(rows){let marks=rows.map(mark).filter(x=>x!==null),pass=marks.filter(x=>x>=D.passMark).length;return {count:rows.length,sat:marks.length,pass,fail:marks.length-pass,missing:rows.length-marks.length,avg:marks.length?(marks.reduce((a,b)=>a+b,0)/marks.length).toFixed(1):'—',rate:marks.length?(pass/marks.length*100).toFixed(1):null}}
function table(head,rows){return rows.length?'<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c===''?'—':c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<p class="muted">No data entered for these filters yet.</p>'}
function card(label,value){return '<div class="card"><span class="muted">'+label+'</span><b>'+value+'</b></div>'}
function render(){if(!D)return;$('nav').innerHTML=['Overview','Class performance','Students','Headcount & targets','Interventions','Item analysis'].map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="tab=this.textContent;render()">'+t+'</button>').join('');const rows=filtered(D.results),s=stats(rows);let html='';if(tab==='Overview'){html='<section class="intro"><h2>Your cohort, at a glance</h2><p>SPM '+esc($('cohort').value)+' · '+esc($('exam').value)+' · Evidence for your next teaching decision</p></section><div class="cards">'+card('Student exam records',s.count)+card('Sat / valid marks',s.sat)+card('Pass',s.pass)+card('Fail',s.fail)+card('Missing / absent',s.missing)+card('Pass rate · of sat',s.rate===null?'—':s.rate+'%')+card('Average mark',s.avg)+card('Classes',unique(rows.map(r=>r.Class_At_Exam||'Unassigned')).length)+'</div><section><h2>Class performance · '+esc($('exam').value)+'</h2><p class="muted">Pass rate = passes ÷ students with valid marks. Blank marks are excluded, not counted as zero.</p>'+table(['Class','Records','Sat','Pass','Fail','Missing / absent','Pass %','Average'],unique(rows.map(r=>r.Class_At_Exam||'Unassigned')).map(c=>{let a=stats(rows.filter(r=>(r.Class_At_Exam||'Unassigned')===c));return [c,a.count,a.sat,a.pass,a.fail,a.missing,a.rate===null?'—':a.rate+'%',a.avg]}))+'</section><section><h2>Exam progress</h2><p class="muted">Uses class at each exam; students may move classes between examinations.</p>'+table(['Exam','Sat','Pass %','Average'],['TOV','AR1','AR2','AR3','SPM'].map(e=>{let a=stats(filtered(D.results,false).filter(r=>r.Exam===e));return[e,a.sat,a.rate===null?'—':a.rate+'%',a.avg]}))+'</section>'}
if(tab==='Overview'||tab==='Class performance'){const classRows=unique(rows.map(r=>r.Class_At_Exam||'Unassigned'));let charts='<div class="split"><section><h2>Class pass rate</h2><p class="muted">Percentage of candidates with valid marks</p>'+classRows.map(c=>{const a=stats(rows.filter(r=>(r.Class_At_Exam||'Unassigned')===c));return '<div class="chartrow"><strong>'+esc(c)+'</strong><div class="track"><i style="width:'+(a.rate||0)+'%"></i></div><span>'+(a.rate===null?'—':a.rate+'%')+'</span></div>'}).join('')+'</section><section><h2>Pass & fail distribution</h2>'+(s.sat?'<div class="donut" style="background:conic-gradient(#10a88b 0 '+s.rate+'%,#eb7082 '+s.rate+'% 100%)"><span>'+s.rate+'%<small>pass rate</small></span></div><p class="legend">● Pass '+s.pass+' &nbsp; / &nbsp; Fail '+s.fail+' · Sat '+s.sat+'</p>':'<p class="muted">No valid marks yet.</p>')+'</section></div>';html=charts+html;if(tab==='Class performance')html+='<section><h2>Class details</h2>'+table(['Class','Sat','Pass','Fail','Average'],classRows.map(c=>{const a=stats(rows.filter(r=>(r.Class_At_Exam||'Unassigned')===c));return[c,a.sat,a.pass,a.fail,a.avg]}))+'</section>';}
if(tab==='Students')html='<section><h2>Student results</h2>'+table(['Student','Year','Form','Class at exam','Exam','Mark /100','Grade (auto)','Result'],rows.map(r=>[r.Student_Name,r.Academic_Year,r.Form,r.Class_At_Exam,r.Exam,mark(r)??'—',gradeFor(r.Total_Mark_100,r.Attendance_Optional),mark(r)===null?'Missing / absent':mark(r)>=D.passMark?'Pass':'Fail']))+'</section>';
if(tab==='Headcount & targets'){let tr=D.tracker.slice(3).filter(r=>r[2]&&String(r[0])===$('cohort').value&&(!$('classFilter').value||r[1]===$('classFilter').value)&&String(r[2]).toLowerCase().includes($('search').value.trim().toLowerCase()));html='<section><h2>Individual headcount</h2><p class="muted">Tracker class is the original 2026 class, as labelled in your Sheet. Targets are read from HEADCOUNT_TRACKER; empty targets stay empty. Exam and Form filters do not apply to this multi-exam tracker. M = mark; G = the corresponding grade, calculated automatically. Grade scale: 90–100 A+, 80–89 A, 70–79 A−, 65–69 B+, 60–64 B, 55–59 C+, 50–54 C, 45–49 D, 40–44 E, 0–39 G. TH = absent.</p>'+table(['Cohort','Class (2026)','Student','TOV M','TOV G','OTR1 M','OTR1 G','AR1 M','AR1 G','OTR2 M','OTR2 G','AR2 M','AR2 G','OTR3 M','OTR3 G','AR3 M','AR3 G','ETR M','ETR G'],tr.map(trackerWithGrades))+'</section><section><h2>Class targets · '+esc($('exam').value)+'</h2>'+table(['Year','Class','Target passes','Target pass %','Notes'],filtered(D.targets).map(r=>[r.Academic_Year,r.Class,r.Target_Passes,r['Target_Pass_%'],r.Notes]))+'</section>'}
if(tab==='Interventions')html='<section><h2>Intervention records</h2>'+table(['Student','Class','Exam','Weak paper','Weak part','Intervention','Start','Follow-up','Status','Notes'],filtered(D.interventions).map(r=>[r.Student_Name,r.Class,r.Exam,r.Weak_Paper,r.Weak_Part,r.Intervention,r.Start_Date,r.Follow_Up_Date,r.Status,r.Notes]))+'</section>';
if(tab==='Item analysis'){let items=filtered(D.items);const groups={};items.forEach(r=>{let score=num(r.Score),max=num(r.Max_Score);if(score===null||max===null||max<=0||score<0||score>max)return;let k=String(r.Paper)+' / '+String(r.Part);let g=groups[k]||(groups[k]={n:0,score:0,max:0});g.n++;g.score+=score;g.max+=max});html='<section><h2>Paper & part strengths</h2><p class="muted">Based only on component marks entered in ITEM_ANALYSIS_DATA. Overall exam marks cannot identify weak papers or parts.</p>'+table(['Paper / part','Entries','Total score / maximum','Weighted accuracy'],Object.entries(groups).map(([k,g])=>[k,g.n,g.score+' / '+g.max,(100*g.score/g.max).toFixed(1)+'%']))+'</section><section><h2>Item details</h2>'+table(['Student','Paper','Part','Item / task','Score','Maximum','Notes'],items.map(r=>[r.Student_Name,r.Paper,r.Part,r.Item_or_Task,r.Score,r.Max_Score,r.Weakness_Notes]))+'</section>'}
$('content').innerHTML=html}
$('cohort').onchange=()=>{setExams();render()};$('exam').onchange=()=>{setClasses();render()};$('classFilter').onchange=render;$('form').onchange=render;$('search').oninput=render;load();
</script></body></html>
